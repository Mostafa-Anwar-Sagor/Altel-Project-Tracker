name: Deploy Backend to Azure App Service

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip backend folder
        run: cd backend && zip -r ../backend.zip . -x "*.pyc" -x "__pycache__/*"

      - name: Deploy via ZipDeploy (curl)
        run: |
          curl -X POST \
            "https://protracker-altel.scm.azurewebsites.net/api/zipdeploy" \
            -u "${{ secrets.AZURE_DEPLOY_USER }}:${{ secrets.AZURE_DEPLOY_PASS }}" \
            --data-binary @backend.zip \
            --max-time 300 \
            -w "\nHTTP Status: %{http_code}\n" \
            -f

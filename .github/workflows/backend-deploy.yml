name: Deploy Backend to Azure App Service

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        run: npm ci && npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ''

      - name: Copy frontend build into backend
        run: cp -r frontend/dist backend/frontend_build

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Zip backend folder
        run: cd backend && zip -r ../backend.zip . -x "*.pyc" -x "__pycache__/*" -x "db.sqlite3"

      - name: Deploy to Azure App Service
        run: |
          az webapp deploy \
            --resource-group rg-protracker \
            --name protracker-altel \
            --src-path backend.zip \
            --type zip \
            --async true
